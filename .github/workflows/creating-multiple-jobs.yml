name: creating-multiple-jobs

on: workflow_dispatch

jobs:
  build:
   runs-on: ubuntu-latest
   steps:
     - name: Build step
       run: echo "A demo build"
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Test step
        run: echo "Running test"
  deploy: 
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deply step
        run: echo "Deploy"
